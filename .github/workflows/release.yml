name: Release Minecraft 26.2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: mc-26.2

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Build
        run: gradle build

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v26.2.0 \
            build/libs/ominous-vault-track-26.2.0.jar \
            --target mc-26.2 \
            --title "Ominous Vault Track 26.2.0" \
            --notes "Ported to Minecraft 26.2.

          Requirements:
          - Minecraft 26.2
          - Fabric Loader 0.19.3+
          - Fabric API
          - Cloth Config
          - Mod Menu optional

          Features:
          - Highlights ominous vaults
          - Through-wall vault outline
          - Tracer lines
          - Locally hides handled vaults"
